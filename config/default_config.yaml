# YOLOv11 Default Configuration

# Model Configuration
model:
  size: 'n'  # n, s, m, l, x
  task: 'detect'  # detect, segment, pose, classify
  pretrained: true

# Training Configuration
train:
  epochs: 100
  batch: 16
  imgsz: 640
  device: ''  # auto-detect
  augment: true
  patience: 50  # Early stopping patience
  save_period: 10  # Save checkpoint every N epochs
  optimizer: 'auto'  # auto, SGD, Adam, AdamW
  lr0: 0.01  # Initial learning rate
  momentum: 0.937
  weight_decay: 0.0005

# Validation Configuration
val:
  batch: 16
  imgsz: 640
  conf: 0.001
  iou: 0.6
  save_json: true

# Testing Configuration
test:
  batch: 16
  imgsz: 640
  conf: 0.25
  iou: 0.45

# Inference Configuration
inference:
  conf: 0.25
  iou: 0.45
  max_det: 300  # Maximum detections per image
  show_labels: true
  show_conf: true
  line_width: 2

# Tracking Configuration
tracking:
  tracker: 'bytetrack.yaml'
  persist: true
  show_tracks: true
  track_buffer: 30

# Data Augmentation
augmentation:
  hsv_h: 0.015
  hsv_s: 0.7
  hsv_v: 0.4
  degrees: 0.0
  translate: 0.1
  scale: 0.5
  shear: 0.0
  perspective: 0.0
  flipud: 0.0
  fliplr: 0.5
  mosaic: 1.0
  mixup: 0.0

# Paths
paths:
  data: './data'
  models: './models'
  logs: './logs'
  reports: './reports'

# Logging
logging:
  level: 'INFO'
  tensorboard: true
  save_metrics: true
